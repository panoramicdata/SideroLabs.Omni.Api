name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Provide test configuration
      # appsettings.json is gitignored, but the test fixtures require its TestExpectations
      # section - without it 38 tests fail with "Failed to load TestExpectations from
      # configuration". The committed example supplies CI-appropriate values.
      run: cp SideroLabs.Omni.Api.Tests/appsettings.example.json SideroLabs.Omni.Api.Tests/appsettings.json

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      # Integration tests hit the live Omni gRPC API and need credentials CI does not have.
      # Running them here made every tagged build fail, so the publish job never ran.
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration"

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: ./artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Login to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: david_n_m_bond

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate